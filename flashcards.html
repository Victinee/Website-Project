<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcards - TECCY</title>
  <link rel="stylesheet" href="menustyle.css">
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
  <style>
    /* Page specific styles only - Layout handled by menustyle.css */

    /* ===== FLASHCARD CONTAINER ===== */
    .flashcard-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 30px;
      perspective: 1000px;
    }

    .flashcard {
      width: 100%;
      max-width: 550px;
      height: 280px;
      background: #ffffff;
      border: 4px solid var(--menu-border-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 8px 8px var(--shadow-color);
      transition: all 0.3s ease;
      color: var(--text-color);
      text-align: center;
      padding: 30px;
      font-size: 1.4rem;
      line-height: 1.8;
      position: relative;
    }

    .flashcard::before {
      content: 'CLICK TO FLIP';
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-size: 0.8rem;
      color: var(--text-color);
      opacity: 0.6;
    }

    .flashcard:hover {
      transform: translate(4px, 4px);
      box-shadow: 4px 4px var(--shadow-color);
    }

    .flashcard.flipped {
      background: var(--card-bg);
      border-color: var(--menu-border-dark);
    }

    .flashcard.flipped::before {
      content: 'ANSWER';
      color: var(--text-color);
    }

    /* ===== PROGRESS SECTION ===== */
    .progress-section {
      text-align: center;
      margin-bottom: 30px;
      background: #ffffff;
      border: 3px solid var(--menu-border-dark);
      padding: 16px 24px;
      box-shadow: 4px 4px var(--shadow-color);
    }

    .progress-text {
      font-size: 1.2rem;
      color: var(--text-color);
      letter-spacing: 2px;
    }

    /* ===== BUTTONS ===== */
    .button-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Reusing .btn classes but ensuring they don't conflict badly */
    .btn {
      font-size: 1.2rem;
      padding: 14px 28px;
      border: 2px solid var(--menu-border-dark);
      cursor: pointer;
      transition: all 0.1s ease;
      min-width: 140px;
      box-shadow: 4px 4px var(--shadow-color);
    }

    .btn-primary {
      background: var(--button-default);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--button-hover);
      transform: translate(2px, 2px);
      box-shadow: 2px 2px var(--shadow-color);
    }

    .btn-secondary {
      background: #ffffff;
      border-color: var(--menu-border-dark);
      color: var(--text-color);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--card-bg);
      transform: translate(2px, 2px);
      box-shadow: 2px 2px var(--shadow-color);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ===== NO CARDS MESSAGE ===== */
    .no-cards-message {
      text-align: center;
      padding: 60px 40px;
      background: #ffffff;
      border: 3px solid var(--menu-border-dark);
      margin: 20px auto;
      max-width: 500px;
      box-shadow: 8px 8px var(--shadow-color);
    }

    .no-cards-message h2 {
      font-size: 1.6rem;
      color: var(--text-color);
      margin-bottom: 20px;
    }

    .no-cards-message p {
      color: var(--text-color);
      margin-bottom: 30px;
      font-size: 1.2rem;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <!-- Inventory Modal -->
  <div class="inventory-modal" id="inventoryModal">
    <div class="inventory-container">
      <div class="inventory-title">
        <span>Warehouse</span>
        <button class="close-btn" onclick="toggleInventory()">X</button>
      </div>
      <div class="inventory-grid" id="inventoryGrid">
        <!-- Grid slots generated by JS -->
      </div>
    </div>
  </div>

  <div class="game-menu-container">
    <!-- Warehouse/Inventory Button -->
    <div class="warehouse-btn" onclick="toggleInventory()">
      <img src="assets/backpack.png" alt="Warehouse">
    </div>

    <div class="sidebar">
      <!-- Sidebar content essentially rewritten to match structure but keeping links -->
      <h2>Teccy</h2>

      <div class="nav-section">
        <a href="index.html">Back to Subjects</a>
      </div>

      <div class="sidebar-divider"></div>

      <div class="nav-section">
        <a href="dashboard.html">Dashboard</a>
        <a href="buddy.html">Buddy System</a>
        <a href="flashcards.html" class="active" style="background-color: var(--accent-yellow);">Flashcards</a>
      </div>
    </div>

    <div class="main-content">
      <div class="header">
        <h1>// MEMORY TRAINING</h1>
        <p>Master key concepts with interactive flashcards</p>
      </div>

      <div id="flashcardContent">
        <div class="progress-section">
          <div class="progress-text" id="progressText">CARD 1 OF 10</div>
        </div>

        <div class="flashcard-container">
          <div class="flashcard" id="flashcard" onclick="flipCard()">
            <div id="cardContent">Click to reveal answer</div>
          </div>
        </div>

        <div class="button-group">
          <button class="btn btn-secondary" id="prevBtn" onclick="previousCard()" disabled>[ PREV ]</button>
          <button class="btn btn-primary" id="nextBtn" onclick="nextCard()">[ NEXT ]</button>
          <button class="btn btn-secondary" onclick="backToDashboard()">[ BACK ]</button>
        </div>
      </div>

      <div id="noCardsMessage" class="no-cards-message" style="display: none;">
        <h2>PERFECT SCORE!</h2>
        <p>No wrong answers to review. Keep up the excellent work, player!</p>
        <div class="button-group">
          <button class="btn btn-primary" onclick="showAllCards()">STUDY ALL</button>
          <button class="btn btn-secondary" onclick="backToDashboard()">DASHBOARD</button>
        </div>
      </div>

      <footer>&copy; 2025 TECCY // AI LEARNING PLATFORM</footer>
    </div>
  </div>

  <script src="menuscript.js"></script>
  <script>

    const formulaDatabase = {
      algebra: {
        'Linear Equations': { question: 'Linear Equation Formula', answer: 'ax + b = c\nTo solve: x = (c - b) / a\nExample: 2x + 5 = 13 → x = 4' },
        'Simplification': { question: 'Simplification Rules', answer: 'Combine like terms: ax + bx = (a+b)x\nExample: 2x + 3x - x = 4x' },
        'Expansion': { question: 'Expansion Formulas', answer: 'Distributive: a(b + c) = ab + ac\n(a + b)² = a² + 2ab + b²\n(a - b)² = a² - 2ab + b²' },
        'Factorization': { question: 'Factorization Methods', answer: 'Common factor: ax + ay = a(x + y)\nDifference of squares: a² - b² = (a+b)(a-b)' },
        'Substitution': { question: 'Substitution Method', answer: 'Replace variable with given value\nExample: If x = 5, then 2x = 10' },
        'Terminology': { question: 'Algebraic Terms', answer: 'Coefficient: Number multiplying variable\nVariable: Letter representing unknown\nConstant: Fixed number' }
      },
      geometry: {
        'Angles': { question: 'Angle Properties', answer: 'Triangle: Sum = 180°\nQuadrilateral: Sum = 360°\nPolygon: Sum = (n-2) × 180°' },
        'Area': { question: 'Area Formulas', answer: 'Rectangle: l × w\nTriangle: ½ × base × height\nCircle: πr²' },
        'Polygons': { question: 'Polygon Properties', answer: 'Pentagon: 5 sides\nHexagon: 6 sides\nOctagon: 8 sides' },
        'Circle': { question: 'Circle Formulas', answer: 'Circumference: 2πr\nArea: πr²\nArc length: (θ/360) × 2πr' },
        'Volume': { question: 'Volume Formulas', answer: 'Cube: s³\nCylinder: πr²h\nSphere: (4/3)πr³' },
        'Triangles': { question: 'Triangle Properties', answer: 'Pythagorean: a² + b² = c²\nArea: ½ × base × height' }
      },
      calculus: {
        'Derivatives': { question: 'Derivative Rules', answer: 'Power rule: d/dx(xⁿ) = nxⁿ⁻¹\nd/dx(c) = 0\nd/dx(eˣ) = eˣ' },
        'Integrals': { question: 'Integration Rules', answer: '∫xⁿdx = xⁿ⁺¹/(n+1) + C\n∫cos x dx = sin x + C' },
        'Limits': { question: 'Limit Properties', answer: 'lim(x→∞) 1/x = 0\nL\'Hôpital\'s rule for 0/0 forms' }
      },
      probability: {
        'Basic Probability': { question: 'Probability Basics', answer: 'P(A) = favorable / total\n0 ≤ P(A) ≤ 1' },
        'Independent Events': { question: 'Independent Events', answer: 'P(A and B) = P(A) × P(B)' },
        'Permutations': { question: 'Permutation Formula', answer: 'nPr = n!/(n-r)!\nOrder matters' },
        'Combinations': { question: 'Combination Formula', answer: 'nCr = n!/[r!(n-r)!]\nOrder doesn\'t matter' }
      },
      trigonometry: {
        'Trigonometric Values': { question: 'Key Trig Values', answer: 'sin(30°)=1/2, sin(45°)=√2/2, sin(60°)=√3/2\ncos(30°)=√3/2, cos(45°)=√2/2, cos(60°)=1/2' },
        'Definitions': { question: 'Trig Ratios', answer: 'sin θ = opposite/hypotenuse\ncos θ = adjacent/hypotenuse\ntan θ = opposite/adjacent' },
        'Identities': { question: 'Fundamental Identities', answer: 'sin²θ + cos²θ = 1\n1 + tan²θ = sec²θ' }
      }
    };

    const defaultFlashcards = [
      { question: 'What is a variable?', answer: 'A symbol representing an unknown value' },
      { question: 'What is an equation?', answer: 'A statement showing two expressions are equal' },
      { question: 'What is factoring?', answer: 'Breaking down an expression into factors' },
      { question: 'Distributive property?', answer: 'a(b + c) = ab + ac' },
      { question: 'What is slope?', answer: 'The measure of steepness: rise/run' }
    ];

    const diagnosisQuestions = {
      algebra: [
        { question: "Solve: 2x + 5 = 13", correct: 2, subtopic: "Linear Equations" },
        { question: "Simplify: 2x + 3x - x", correct: 1, subtopic: "Simplification" },
        { question: "Expand: 2(x + 3)", correct: 1, subtopic: "Expansion" },
        { question: "Factor: x² + 5x + 6", correct: 0, subtopic: "Factorization" }
      ],
      geometry: [
        { question: "Sum of angles in triangle?", correct: 1, subtopic: "Angles" },
        { question: "Area of rectangle 5×3?", correct: 1, subtopic: "Area" }
      ],
      calculus: [
        { question: "Derivative of x²?", correct: 1, subtopic: "Derivatives" }
      ],
      probability: [
        { question: "P(rolling 3 on die)?", correct: 0, subtopic: "Basic Probability" }
      ],
      trigonometry: [
        { question: "sin(90°)?", correct: 3, subtopic: "Trigonometric Values" }
      ]
    };

    let flashcards = [];
    let currentCard = 0;
    let isFlipped = false;

    function generateFlashcardsFromWrongAnswers() {
      const generatedCards = [];
      const topics = ['algebra', 'geometry', 'calculus', 'probability', 'trigonometry'];
      const addedSubtopics = new Set();

      topics.forEach(topic => {
        const storedAnswers = sessionStorage.getItem('answers_' + topic);
        if (storedAnswers) {
          const answers = JSON.parse(storedAnswers);
          const questions = diagnosisQuestions[topic];
          if (questions) {
            answers.forEach((answer, index) => {
              if (questions[index] && answer !== null && answer !== questions[index].correct) {
                const subtopic = questions[index].subtopic;
                const subtopicKey = `${topic}_${subtopic}`;
                if (!addedSubtopics.has(subtopicKey) && formulaDatabase[topic] && formulaDatabase[topic][subtopic]) {
                  generatedCards.push({
                    question: `${questions[index].question}\n\n(Review this concept!)`,
                    answer: formulaDatabase[topic][subtopic].answer
                  });
                  addedSubtopics.add(subtopicKey);
                }
              }
            });
          }
        }
      });

      return generatedCards;
    }

    function loadFlashcards() {
      flashcards = generateFlashcardsFromWrongAnswers();

      if (flashcards.length === 0) {
        document.getElementById('flashcardContent').style.display = 'none';
        document.getElementById('noCardsMessage').style.display = 'block';
      } else {
        document.getElementById('flashcardContent').style.display = 'block';
        document.getElementById('noCardsMessage').style.display = 'none';
        loadCard();
      }
    }

    function showAllCards() {
      flashcards = defaultFlashcards;
      document.getElementById('flashcardContent').style.display = 'block';
      document.getElementById('noCardsMessage').style.display = 'none';
      currentCard = 0;
      loadCard();
    }

    function loadCard() {
      if (flashcards.length === 0) return;

      const card = flashcards[currentCard];
      const cardContent = document.getElementById('cardContent');
      const flashcard = document.getElementById('flashcard');

      isFlipped = false;
      flashcard.classList.remove('flipped');
      cardContent.textContent = card.question;
      document.getElementById('progressText').textContent = `CARD ${currentCard + 1} OF ${flashcards.length}`;
      document.getElementById('prevBtn').disabled = currentCard === 0;
      document.getElementById('nextBtn').disabled = currentCard === flashcards.length - 1;
    }

    function flipCard() {
      if (flashcards.length === 0) return;

      const card = flashcards[currentCard];
      const cardContent = document.getElementById('cardContent');
      const flashcard = document.getElementById('flashcard');

      isFlipped = !isFlipped;
      if (isFlipped) {
        cardContent.textContent = card.answer;
        flashcard.classList.add('flipped');
      } else {
        cardContent.textContent = card.question;
        flashcard.classList.remove('flipped');
      }
    }

    function nextCard() {
      if (currentCard < flashcards.length - 1) {
        currentCard++;
        loadCard();
      }
    }

    function previousCard() {
      if (currentCard > 0) {
        currentCard--;
        loadCard();
      }
    }

    function backToDashboard() {
      window.location.href = 'dashboard.html';
    }

    loadFlashcards();
  </script>
</body>

</html>
