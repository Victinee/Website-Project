<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Almanac</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="almanac.css">
</head>
<body>
    <div class="almanac-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="almanac-title">CROP ALMANAC</div>
            <div class="stats">
                <span class="stat">DISCOVERED <span class="stat-value" id="discovered-count">4</span></span>
                <span class="stat">TOTAL <span class="stat-value" id="total-count">12</span></span>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Left Panel -->
            <div class="left-panel">
                <div class="crop-header">
                    <div class="crop-name" id="crop-name">Tomato</div>
                    <div class="crop-number">No. <span id="crop-number">001</span></div>
                    <div class="crop-sell-value">$<span id="sell-value">25</span></div>
                </div>

                <div class="crop-display">
                    <img id="crop-image" src="https://via.placeholder.com/200x200/98d8c8/ffffff?text=Tomato" alt="Crop Image">
                </div>

                <div class="crop-description">
                    <p id="description-text">A juicy red vegetable that's technically a fruit. Perfect for salads, sauces, and sandwiches. Grows best in warm weather with plenty of sunlight.</p>
                </div>

                <div class="crop-name-bottom" id="crop-name-bottom">Tomato</div>
            </div>

            <!-- Right Panel -->
            <div class="right-panel">
                <div class="crop-grid" id="crop-grid">
                    <!-- Crop slots will be generated by JavaScript -->
                </div>

                <div class="scroll-indicators">
                    <div class="scroll-arrow scroll-up">▲</div>
                    <div class="scroll-arrow scroll-down">▼</div>
                </div>
            </div>
        </div>

        <!-- Bottom Buttons -->
        <div class="bottom-buttons">
            <button class="menu-button">START MENU</button>
            <button class="menu-button">SELECT/SEARCH</button>
        </div>
    </div>

    <script src="almanac.js"></script>
</body>
</html>
